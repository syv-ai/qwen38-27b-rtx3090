# Qwen3.8-27B on one RTX 3090, containerized. See docs/docker.md.
#
#   docker compose --profile single up -d     # low latency: MTP speculative decoding
#   docker compose --profile batch  up -d     # throughput
#   docker compose run --rm prepare           # just download + requantize the model
#   docker compose run --rm single verify     # verify.sh inside the container
#
# Knobs go in a .env file next to this file (never committed): VLLM_API_KEY=...,
# and any of the start-script variables (CTX, KV, MAX_LEN, MAX_SEQS, GPU_UTIL, VISION,
# SPEC_ATTN, DRAFT_TOKENS, EXTRA_ARGS, ...) — .env is passed straight into the
# container. Fastest single-user decode, if the card is yours alone (README,
# "If you are the only user"; the drafter it needs is already downloaded by
# prepare):
#
#   printf 'SPEC=dflash2\nDFLASH_TOKENS=15\nPREFIX_CACHE=1\n' >> .env
#
# On WSL2 add VLLM_WSL2_ENABLE_PIN_MEMORY=1 to that .env: SPEC=dflash2 forces vLLM's
# V2 model runner, whose UVA buffers are refused there by default, and the container
# aborts at "RuntimeError: UVA is not available" before loading weights (docs/docker.md).
# PORT and MODELS_DIR are read here: models live in ./models by default
# (the same layout as the venv install, so both can share one download).
# One GPU: run either "single" or "batch", not both.
#
# More than one GPU (issues #68, #104) — no hand-edit of this file needed:
#
#   GPU_COUNT=2                                  # cards handed to the container
#   EXTRA_ARGS="--tensor-parallel-size 2"        # cards the engine actually uses
#
# GPU_COUNT defaults to 1, which means "the first GPU the runtime enumerates",
# i.e. GPU 0 — not the card you meant if the box has mixed hardware. To choose
# *which* cards, expose them all and pin inside the container:
#
#   GPU_COUNT=all
#   CUDA_VISIBLE_DEVICES=1,2
#
# The device reservation below decides which cards are visible, so setting
# NVIDIA_VISIBLE_DEVICES in .env alone was not enough (#68); CUDA_VISIBLE_DEVICES
# is read inside the container and is what docs/gotchas.md 53 recommends.
# Pin the KV pool before you benchmark or trim context on a multi-GPU box: the
# launcher skips the single-card KV_MEM pin under --tensor-parallel-size > 1,
# so the pool is sized from GPU_UTIL and moves with compile-cache state
# (README, "More than one GPU"; docs/gotchas.md 48).

x-qwen: &qwen
  # Prebuilt on every main push by .github/workflows/docker-image.yml; the
  # first `up` pulls it (~9.5 GB, pull_policy below) instead of the 20-minute
  # local build. `docker compose build` (or `up --build`) still builds the
  # identical image under the same tag name. Immutable per-commit tags:
  # ghcr.io/syv-ai/hyperqwen:sha-<7>.
  # F12 traceability: the image running here on 2026-09-08 resolved to
  # ghcr.io/syv-ai/qwen38-27b-rtx3090@sha256:86ecc9adb54ed76f0ccbebbdb7916490f918e42d2ac2a2ed8c0d50cc25323a57.
  # `latest` is a moving tag — quote the digest, not the tag, when reporting
  # benchmark provenance (bench/run_benchmarks.sh manifest).
  image: ghcr.io/syv-ai/hyperqwen:latest
  build: .
  pull_policy: missing
  ipc: host
  env_file:
    - path: .env
      required: false
  environment:
    HOME: /cache
  volumes:
    - ${MODELS_DIR:-./models}:/app/models
    - qwen-cache:/cache

x-serve: &serve
  <<: *qwen
  ports:
    # F06: loopback by default. Keyless serving on 0.0.0.0 exposes the server
    # to the whole network with no auth; opt into that explicitly with
    # BIND=0.0.0.0 (compose interpolates ${BIND:-127.0.0.1}).
    - "${BIND:-127.0.0.1}:${PORT:-18020}:${PORT:-18020}"
  depends_on:
    prepare:
      condition: service_completed_successfully
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            # 1 by default (= GPU 0). GPU_COUNT=2 / GPU_COUNT=all for TP; see
            # the multi-GPU note in the header for picking specific cards.
            count: ${GPU_COUNT:-1}
            capabilities: [gpu]
  restart: unless-stopped
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://127.0.0.1:${PORT:-18020}/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 900s   # first start: torch.compile + CUDA graphs + FlashInfer JIT

services:
  prepare:
    <<: *qwen
    command: prepare

  single:
    <<: *serve
    profiles: [single]
    command: single

  batch:
    <<: *serve
    profiles: [batch]
    command: batch

  # Headroom: OpenAI-compatible compression proxy in front of `single`.
  # Runs standalone on the compose network with its own published port;
  # clients point at 127.0.0.1:8787 with the same VLLM_API_KEY. It
  # compresses/aligns the context (HEADROOM_MODE=cache keeps vLLM prefix-cache
  # hits stable) and forwards to the vLLM over Docker DNS. CPU-only.
  # First start downloads Kompress/embedding models from HF, so the
  # healthcheck allows a long start period.
  headroom:
    # F06: opt-in profile. Headroom used to share the `single` profile while
    # requiring VLLM_API_KEY, so `compose --profile single config` failed with
    # the key-optional .env.example. Start it explicitly:
    #   docker compose --profile single --profile headroom up -d
    profiles: [headroom]
    image: ghcr.io/headroomlabs-ai/headroom:latest
    pull_policy: missing
    depends_on:
      single:
        condition: service_healthy
    # Image entrypoint is already `headroom proxy`, so command supplies flags
    # only. --host 0.0.0.0 binds the container's eth0, which is what Docker's
    # publish dials; upstream is the vLLM by service name (env equivalent
    # below). 8787 straight through, host side via HEADROOM_PORT/BIND.
    command: ["--host", "0.0.0.0", "--port", "8787", "--openai-api-url", "http://single:${PORT:-18020}"]
    ports:
      - "${BIND:-127.0.0.1}:${HEADROOM_PORT:-8787}:8787"
    environment:
      HEADROOM_MODE: ${HEADROOM_MODE:-cache}
      HEADROOM_TELEMETRY: "off"
      # Proxy auth: keyless-local by default. The publish is host-loopback bound,
      # so only local processes reach it; set HEADROOM_PROXY_TOKEN to require a
      # bearer token (browsers cannot send one, which 401s the dashboard).
      HEADROOM_PROXY_TOKEN: ${HEADROOM_PROXY_TOKEN:-}
      # Custom OpenAI-compatible backend: current var is OPENAI_TARGET_API_URL
      # (OPENAI_BASE_URL is the legacy name; set both, same value).
      # Docker DNS: reachable because both services share the compose network.
      # Follows PORT instead of a hardcoded 18020.
      OPENAI_TARGET_API_URL: http://single:${PORT:-18020}
      OPENAI_BASE_URL: http://single:${PORT:-18020}
      OPENAI_API_KEY: ${VLLM_API_KEY:-}
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

volumes:
  qwen-cache:
